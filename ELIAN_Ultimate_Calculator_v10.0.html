<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#04060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ELIAN">
<meta name="description" content="ELIAN Ultimate Calculator v10 — modulare Offline-Mathematik-Werkbank. Liquid-Glass, dark, eine Datei.">
<title>ELIAN Ultimate Calculator v10</title>
<style>
/* =====================================================================
   ELIAN v10 — Liquid-Glass-Designsystem „Vollgas"
   Ein dark-first System: Aurora-Tiefe, mehrschichtiges Glas,
   Feder-Physik, Spekular-Kanten, physische Reaktionen.
   ===================================================================== */
:root{
  /* Tiefe */
  --c-void:#04060c; --c-bg:#080c16; --c-bg2:#0b1120; --c-panel:#0d1424;
  --c-ink:#f6f8ff; --c-ink2:#b9c3d8; --c-ink3:#76839e;

  /* Akzente (umschaltbar, data-accent am <html>) */
  --acc:#0a84ff; --acc2:#5e5ce6; --acc3:#bf5af2;
  --ok:#30d158; --warn:#ffd60a; --err:#ff453a; --mint:#63e6e2;

  /* Glas — wirklich transparent, mehrschichtig */
  --g1:rgba(148,163,190,.10);   /* Basisfläche */
  --g2:rgba(148,163,190,.16);   /* Karten */
  --g3:rgba(148,163,190,.26);   /* erhaben */
  --gline:rgba(255,255,255,.12);
  --gline2:rgba(255,255,255,.20);
  --gblur:blur(34px) saturate(180%);
  --gblur-strong:blur(52px) saturate(200%) brightness(1.08);
  --shadow:0 24px 60px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.30);
  --shadow-lift:0 34px 80px rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.34);
  --inlight:inset 0 1px 0 rgba(255,255,255,.13), inset 0 -1px 0 rgba(0,0,0,.22);

  /* Geometrie */
  --r-xs:10px; --r-s:14px; --r-m:19px; --r-l:26px; --r-xl:34px; --r-full:999px;
  --rail-w:264px; --dock-h:calc(64px + env(safe-area-inset-bottom));

  /* Physik */
  --spring:cubic-bezier(.3,1.5,.45,1);
  --pop:cubic-bezier(.2,1.7,.4,1);
  --ease:cubic-bezier(.32,.72,0,1);
  --t-fast:.15s var(--ease);
  --t-mid:.28s var(--ease);

  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  font-size:calc(16px * var(--font-scale,1));
  -webkit-font-smoothing:antialiased;
  color-scheme:dark;
}
html[data-accent="violet"]{--acc:#7d5cff;--acc2:#b04bff;--acc3:#ff5ce6}
html[data-accent="mint"]{--acc:#2fd6c3;--acc2:#38b6ff;--acc3:#7df9c9}
html[data-accent="ember"]{--acc:#ff7a2f;--acc2:#ffb02f;--acc3:#ff4f6d}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100dvh;color:var(--c-ink);
  background:var(--c-void);
  font-size:15px;letter-spacing:-.01em;
  overscroll-behavior:none;
}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
::selection{background:color-mix(in srgb,var(--acc) 40%,transparent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ============ Aurora-Tiefe (GPU-günstig: weiche Verläufe statt blur()) ============ */
.aurora{position:fixed;inset:-12%;z-index:0;pointer-events:none;will-change:transform}
.aurora i{position:absolute;display:block;border-radius:50%;opacity:.55;will-change:transform}
.aurora .a1{width:52vmax;height:52vmax;left:-10%;top:-12%;background:radial-gradient(circle at 42% 42%,color-mix(in srgb,var(--acc) 42%,transparent),transparent 62%);animation:drift1 26s var(--ease) infinite alternate}
.aurora .a2{width:44vmax;height:44vmax;right:-12%;top:0%;background:radial-gradient(circle at 58% 42%,color-mix(in srgb,var(--acc3) 34%,transparent),transparent 60%);animation:drift2 32s var(--ease) infinite alternate}
.aurora .a3{width:56vmax;height:56vmax;left:20%;bottom:-26%;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--acc2) 30%,transparent),transparent 58%);animation:drift3 38s var(--ease) infinite alternate}
@keyframes drift1{to{transform:translate3d(9vmax,6vmax,0) scale(1.14)}}
@keyframes drift2{to{transform:translate3d(-8vmax,10vmax,0) scale(.9)}}
@keyframes drift3{to{transform:translate3d(6vmax,-8vmax,0) scale(1.08)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.035;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='120'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='120' height='120' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E")}

/* ============ Glas-Flächen ============
   Karten: Glas-Look über Verläufe + Spekular-Kante (kein backdrop-filter → günstig).
   Chrome (dock, palette, sheet, rail, top): echter Backdrop-Blur. */
.glass.flat{border-radius:var(--r-m)}
.glass{
  position:relative;
  background:linear-gradient(160deg,var(--g2),var(--g1));
  border:1px solid var(--gline);
  box-shadow:var(--shadow),var(--inlight);
  border-radius:var(--r-l);
}
.glass::after{ /* Spekular-Kante */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.16),transparent 32%,transparent 68%,rgba(255,255,255,.05));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;
}
.chrome{
  background:linear-gradient(160deg,var(--g2),var(--g1));
  -webkit-backdrop-filter:var(--gblur);
  backdrop-filter:var(--gblur);
  box-shadow:var(--shadow),var(--inlight);
}
.chrome.strong{
  background:linear-gradient(160deg,var(--g3),var(--g2));
  -webkit-backdrop-filter:var(--gblur-strong);
  backdrop-filter:var(--gblur-strong);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .chrome,.chrome.strong{background:linear-gradient(160deg,rgba(16,22,38,.90),rgba(12,17,30,.82))}
}

/* ============ App-Gerüst ============ */
.app{position:relative;z-index:2;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100dvh}

/* --- Werkzeug-Menü (linke Schiene) --- */
.rail{
  position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;
  padding:18px 12px calc(12px);border-right:1px solid var(--gline);
  background:linear-gradient(200deg,rgba(140,155,185,.10),rgba(140,155,185,.04));
  -webkit-backdrop-filter:var(--gblur);backdrop-filter:var(--gblur);
  overflow:auto;scrollbar-width:none;
}
.rail::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:12px;padding:2px 6px 16px}
.logo{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:linear-gradient(150deg,var(--acc),var(--acc2) 55%,var(--acc3));
  color:#fff;font-weight:900;font-size:19px;letter-spacing:-.03em;
  box-shadow:0 12px 28px color-mix(in srgb,var(--acc) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.34);
  transition:transform .18s var(--spring);
}
.logo:hover{transform:rotate(-4deg) scale(1.05)}
.brand b{font-size:16px;letter-spacing:-.02em;display:block}
.brand small{display:block;color:var(--c-ink2);font-size:11px;margin-top:1px}
.rail-scroll{flex:1;display:grid;gap:14px;align-content:start}
.grp-t{font-size:10.5px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink3);padding:0 8px 3px}
.grp-items{display:grid;gap:2px}
.mod-btn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:10px 11px;border-radius:var(--r-s);color:var(--c-ink2);
  font-size:14px;font-weight:560;letter-spacing:-.01em;
  transition:background var(--t-fast),color var(--t-fast),transform .12s var(--spring);
}
.mod-btn .mi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.07);font-size:14px;transition:background var(--t-fast),transform .12s var(--spring)}
.mod-btn:hover{background:rgba(255,255,255,.07);color:var(--c-ink)}
.mod-btn:hover .mi{background:color-mix(in srgb,var(--acc) 26%,transparent)}
.mod-btn:active{transform:scale(.97)}
.mod-btn.active{background:color-mix(in srgb,var(--acc) 24%,transparent);color:#fff;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 42%,transparent)}
.mod-btn.active .mi{background:linear-gradient(150deg,var(--acc),var(--acc2));color:#fff}
.rail-foot{padding:10px 8px 2px;font-size:10.5px;color:var(--c-ink3);display:flex;justify-content:space-between;align-items:center}

/* --- Hauptbereich --- */
.main{display:flex;flex-direction:column;min-width:0;min-height:100dvh}
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:flex-end;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 20px 12px;
  border-bottom:1px solid transparent;transition:border-color var(--t-mid),background var(--t-mid),backdrop-filter var(--t-mid);
}
.top.scrolled{border-bottom-color:var(--gline);background:rgba(8,12,22,.62);-webkit-backdrop-filter:var(--gblur);backdrop-filter:var(--gblur)}
.titles{flex:1;min-width:0}
.titles h1{margin:0;font-size:clamp(21px,2.6vw,28px);font-weight:820;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:transform var(--t-mid),font-size var(--t-mid);transform-origin:left bottom}
.top.scrolled .titles h1{font-size:19px}
.titles p{margin:2px 0 0;font-size:12px;color:var(--c-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px;align-items:center}
.iconbtn{
  width:40px;height:40px;border-radius:var(--r-s);display:grid;place-items:center;flex:none;
  border:1px solid var(--gline);background:rgba(255,255,255,.07);color:var(--c-ink);font-size:16px;
  transition:background var(--t-fast),transform .12s var(--spring),box-shadow var(--t-fast);
}
.iconbtn:hover{background:rgba(255,255,255,.13)}
.iconbtn:active{transform:scale(.9)}
.iconbtn.on{background:color-mix(in srgb,var(--acc) 30%,transparent);border-color:color-mix(in srgb,var(--acc) 48%,transparent)}
#menuBtn{display:none}

/* --- Bühne --- */
.stage{flex:1;padding:18px 20px calc(var(--dock-h) + 24px);max-width:1180px;width:100%;margin:0 auto;min-width:0}
.view{display:none}
.view.active{display:block;animation:viewIn .34s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* ============ Bausteine ============ */
.card{padding:18px;margin-bottom:14px}
.card h2,.card h3{margin:0 0 10px;letter-spacing:-.022em}
.card h2{font-size:19px;font-weight:780}
.card h3{font-size:14.5px;font-weight:720;color:var(--c-ink2)}
.card p.lead{margin:0 0 12px;color:var(--c-ink2);font-size:13px;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.row.tight{gap:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.spacer{flex:1}
.help{color:var(--c-ink2);font-size:12px;line-height:1.5}
.muted{color:var(--c-ink3)}
.hr{height:1px;background:var(--gline);margin:14px 0}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-full);padding:4px 10px;
  background:rgba(255,255,255,.08);font-size:11.5px;font-weight:650;white-space:nowrap}
.tag.on{background:color-mix(in srgb,var(--acc) 26%,transparent);color:#fff}

/* --- Eingaben --- */
.input,select,textarea{
  width:100%;border:1px solid var(--gline);background:rgba(6,10,20,.45);
  border-radius:var(--r-s);padding:11px 12px;outline:none;font-size:14.5px;
  transition:border-color var(--t-fast),box-shadow var(--t-fast),background var(--t-fast);
  -webkit-appearance:none;appearance:none;
}
select{background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23b9c3d8' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
select option{background:#0d1424;color:var(--c-ink)}
.input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--acc) 22%,transparent);background:rgba(6,10,20,.6)}
::placeholder{color:var(--c-ink3)}
textarea{resize:vertical;min-height:100px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6}

/* --- Tasten --- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--gline);background:rgba(255,255,255,.085);
  border-radius:var(--r-s);padding:10px 15px;min-height:44px;
  font-size:14px;font-weight:640;letter-spacing:-.01em;
  transition:background var(--t-fast),transform .12s var(--spring),box-shadow var(--t-fast),border-color var(--t-fast);
}
.btn:hover{background:rgba(255,255,255,.15);transform:translateY(-1px)}
.btn:active{transform:scale(.955) translateY(0)}
.btn.primary{background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 76%,#000));border-color:transparent;color:#fff;
  box-shadow:0 10px 24px color-mix(in srgb,var(--acc) 38%,transparent)}
.btn.primary:hover{filter:brightness(1.12);box-shadow:0 14px 32px color-mix(in srgb,var(--acc) 46%,transparent)}
.btn.danger{background:color-mix(in srgb,var(--err) 16%,transparent);border-color:color-mix(in srgb,var(--err) 38%,transparent);color:#ff9a92}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;min-height:36px;font-size:12.5px}
.chip{
  border:1px solid var(--gline);background:rgba(255,255,255,.06);color:var(--c-ink2);
  border-radius:var(--r-full);padding:8px 14px;min-height:36px;font-size:12.5px;font-weight:640;
  display:inline-flex;align-items:center;gap:6px;
  transition:background var(--t-fast),color var(--t-fast),transform .12s var(--spring),border-color var(--t-fast);
}
.chip:hover{color:var(--c-ink);background:rgba(255,255,255,.12)}
.chip:active{transform:scale(.94)}
.chip.on{background:color-mix(in srgb,var(--acc) 30%,transparent);border-color:color-mix(in srgb,var(--acc) 52%,transparent);color:#fff}

/* --- Schalter (iOS-Stil) --- */
.toggle{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:var(--r-full);flex:none;
  background:rgba(118,118,128,.34);position:relative;cursor:pointer;border:0;
  transition:background .22s var(--ease)}
.toggle::before{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;border-radius:50%;
  background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.35);transition:transform .24s var(--spring)}
.toggle:checked{background:var(--ok)}
.toggle:checked::before{transform:translateX(20px)}

/* --- Segmented --- */
.seg{display:inline-flex;background:rgba(118,118,128,.24);border-radius:12px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--c-ink2);padding:7px 14px;border-radius:10px;
  font-size:12.5px;font-weight:650;transition:background var(--t-fast),color var(--t-fast)}
.seg button.on{background:rgba(255,255,255,.20);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}

/* ============ Rechner-Layout ============ */
.calc-wrap{display:grid;gap:14px;grid-template-columns:1fr;align-items:start}
.calc-main{width:100%;max-width:560px;margin:0 auto}
@media(min-width:920px){.calc-wrap{grid-template-columns:minmax(420px,560px) minmax(240px,1fr)}.calc-main{margin:0}}

/* ============ Rechner ============ */
.display{
  padding:18px 20px;min-height:118px;display:flex;flex-direction:column;justify-content:center;gap:4px;
  margin-bottom:14px;border-radius:var(--r-l);position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(140,155,185,.11),rgba(140,155,185,.04));
  border:1px solid var(--gline);box-shadow:var(--shadow),var(--inlight);
}
.display .expr{color:var(--c-ink2);min-height:22px;word-break:break-word;font-size:14.5px;font-variant-numeric:tabular-nums}
.display .result{font-size:clamp(28px,5vw,42px);font-weight:830;word-break:break-all;line-height:1.1;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.display .result.exact{background:linear-gradient(100deg,var(--c-ink),color-mix(in srgb,var(--acc) 60%,#fff));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.display.pop .result{animation:popIn .4s var(--pop)}
@keyframes popIn{0%{transform:scale(.86);opacity:.4}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.mem-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:11.5px;color:var(--c-ink2)}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.key{
  height:56px;min-height:52px;border-radius:var(--r-m);border:1px solid var(--gline);
  background:rgba(255,255,255,.07);color:var(--c-ink);
  display:grid;place-items:center;font-size:16.5px;font-weight:640;
  transition:background var(--t-fast),transform .13s var(--spring),box-shadow var(--t-fast);
  user-select:none;-webkit-user-select:none;
}
.key:hover{background:rgba(255,255,255,.12)}
.key:active,.key.pressed{transform:scale(.92);background:rgba(255,255,255,.18)}
.key.op{color:var(--acc);font-weight:750}
.key.fn{font-size:13px;color:var(--c-ink2)}
.key.eq{background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 74%,#000));color:#fff;font-size:19px;
  box-shadow:0 10px 22px color-mix(in srgb,var(--acc) 36%,transparent)}
.key.eq:hover{filter:brightness(1.1)}
.key.warn{color:var(--warn)}
.key.del{color:#ff9a92}
.hist{display:grid;gap:8px;max-height:none}
.hist-item{padding:10px 12px;border-radius:var(--r-s);background:rgba(255,255,255,.045);border:1px solid var(--gline);
  cursor:pointer;transition:background var(--t-fast),transform .1s var(--spring)}
.hist-item:hover{background:rgba(255,255,255,.10)}
.hist-item:active{transform:scale(.985)}
.hist-item .he{font-size:12.5px;color:var(--c-ink2);word-break:break-all}
.hist-item .hr2{font-size:15px;font-weight:700;word-break:break-all}
.hist-empty{color:var(--c-ink3);font-size:12.5px;padding:14px;text-align:center}

/* ============ Bottom-Toolbar (Dock) ============ */
.dock{
  position:fixed;left:50%;transform:translateX(-50%);z-index:40;
  bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:4px;padding:7px 9px;border-radius:var(--r-xl);
  background:linear-gradient(160deg,var(--g3),var(--g1));
  border:1px solid var(--gline2);
  -webkit-backdrop-filter:var(--gblur-strong);backdrop-filter:var(--gblur-strong);
  box-shadow:var(--shadow-lift),var(--inlight);
}
.dock .dbtn{
  display:flex;flex-direction:column;align-items:center;gap:1px;flex:none;
  min-width:56px;padding:7px 9px 6px;border-radius:var(--r-m);
  color:var(--c-ink2);font-size:9.5px;font-weight:650;letter-spacing:-.01em;
  transition:color var(--t-fast),background var(--t-fast),transform .16s var(--spring);
}
.dock .dbtn .di{font-size:20px;line-height:22px;transition:transform .16s var(--spring)}
.dock .dbtn:hover{color:var(--c-ink);background:rgba(255,255,255,.08)}
.dock .dbtn:active{transform:scale(.9)}
.dock .dbtn.active{color:#fff;background:color-mix(in srgb,var(--acc) 30%,transparent)}
.dock .dbtn.active .di{transform:translateY(-1px) scale(1.1)}
/* Bottom-Toolbar bleibt auf allen Geräten unten sichtbar */
@media(min-width:1024px){.dock{max-width:min(720px,calc(100vw - 40px))}}

/* ============ Handy-Sheet (Tool-Menü) ============ */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(2,4,9,.55);opacity:0;pointer-events:none;transition:opacity var(--t-mid);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:76dvh;overflow:auto;
  padding:10px 14px calc(18px + env(safe-area-inset-bottom));
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  background:linear-gradient(200deg,var(--g3),var(--g2));border:1px solid var(--gline2);border-bottom:0;
  -webkit-backdrop-filter:var(--gblur-strong);backdrop-filter:var(--gblur-strong);
  box-shadow:0 -20px 60px rgba(0,0,0,.5);
  transform:translateY(102%);transition:transform .38s var(--ease);
}
.sheet.show{transform:translateY(0)}
.sheet-grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:2px auto 12px}

/* ============ Befehlspalette ============ */
.palette{
  position:fixed;left:50%;top:14dvh;transform:translate(-50%,-14px) scale(.97);z-index:60;
  width:min(620px,calc(100vw - 32px));max-height:64dvh;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity var(--t-mid),transform var(--t-mid);
  border-radius:var(--r-l);overflow:hidden;
}
.palette.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.palette .pinput{border:0;border-bottom:1px solid var(--gline);border-radius:0;background:transparent;font-size:15px;padding:14px 16px}
.palette .plist{overflow:auto;padding:8px}
.pal-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:var(--r-s);font-size:14px;cursor:pointer}
.pal-item .mi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none;font-size:13px}
.pal-item.sel,.pal-item:hover{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.pal-empty{padding:18px;text-align:center;color:var(--c-ink3);font-size:13px}

/* ============ Toasts ============ */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock-h) + 16px);z-index:70;
  display:grid;gap:8px;justify-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
.toast{
  padding:10px 16px;font-size:13px;font-weight:600;border-radius:var(--r-full);
  background:linear-gradient(160deg,var(--g3),var(--g2));border:1px solid var(--gline2);
  -webkit-backdrop-filter:var(--gblur-strong);backdrop-filter:var(--gblur-strong);
  box-shadow:var(--shadow),var(--inlight);
  animation:toastIn .4s var(--pop);
}
.toast.out{animation:toastOut .3s var(--ease) forwards}
.toast.ok{color:#8df0ab}.toast.err{color:#ff9a92}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.94)}}

/* ============ Wahrheitstafel & Raster ============ */
.tt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tt th,.tt td{border:1px solid var(--gline);padding:8px 10px;text-align:center;font-size:13.5px}
.tt th{font-weight:700;color:var(--c-ink2);background:rgba(255,255,255,.06)}
.tt td.one{color:var(--mint);font-weight:700}
.tt td.zero{color:var(--c-ink3)}
.tt tr:hover td{background:rgba(255,255,255,.05)}
.mgrid{display:grid;gap:6px;margin:8px 0}
.mgrid .cell{width:100%;text-align:center;font-family:ui-monospace,Menlo,monospace;padding:8px 4px}
.mgrid .rl{font-size:11px;color:var(--c-ink3);align-self:center;text-align:right;padding-right:4px}
.resultbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;white-space:pre-wrap;word-break:break-word;
  background:rgba(6,10,20,.42);border:1px solid var(--gline);border-radius:var(--r-s);padding:12px 14px;margin-top:10px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* ============ Wellen (Ripple) ============ */
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.34),transparent 70%);
  transform:scale(0);animation:rip .55s var(--ease) forwards;z-index:5}
@keyframes rip{to{transform:scale(2.6);opacity:0}}

/* ============ Responsiv: Tablet / Handy ============ */
@media(max-width:1023px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  #menuBtn{display:grid}
}
@media(max-width:640px){
  .stage{padding:14px 14px calc(var(--dock-h) + 18px)}
  .keys{grid-template-columns:repeat(4,1fr);gap:7px}
  .key{height:50px;min-height:46px}
  .calc-main{max-width:520px}
  .top{padding-left:14px;padding-right:14px}
  .card{padding:15px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .aurora i{animation:none}
}

<!-- =====================================================================
     Mathe-Kern v10 — pur, ohne DOM. Global, damit Tests (node) greifen.
     Exakte rationale Arithmetik (BigInt), Präzedenz-Parser,
     Winkelmodus DEG/GRAD/RAD global wirksam.
     ===================================================================== -->
<script>
/* ---------- Winkelmodus ---------- */
var ANGLE_MODE = 'deg';
var ANS_VALUE = 0;   // letztes Ergebnis (global:Engine liest 'ans')
function setAngleMode(m){ if(m==='deg'||m==='rad'||m==='gon') ANGLE_MODE = m; return ANGLE_MODE; }
function _deg2rad(x){ return ANGLE_MODE==='deg' ? x*Math.PI/180 : ANGLE_MODE==='gon' ? x*Math.PI/200 : x; }
function _rad2deg(x){ return ANGLE_MODE==='deg' ? x*180/Math.PI : ANGLE_MODE==='gon' ? x*200/Math.PI : x; }

/* ---------- exakte rationale Zahlen ---------- */
function rq(n,d){ // Rational {n:BigInt,d:BigInt}, normiert, d>0
  if(typeof n==='number'){ n = BigInt(Math.round(n)); }
  if(typeof d==='number'){ d = BigInt(Math.round(d)); }
  if(!n) n = 0n; if(!d) d = 1n;
  if(d < 0n){ n = -n; d = -d; }
  if(n === 0n) return {n:0n,d:1n};
  var g = gcd(n<0n?-n:n, d); if(g > 1n){ n/=g; d/=g; }
  return {n:n,d:d};
}
function gcd(a,b){ while(b){ var t=a%b; a=b; b=t; } return a<0n?-a:a; }
function lcm(a,b){ if(a===0n||b===0n) return 0n; var x=a<0n?-a:a, y=b<0n?-b:b; return x/gcd(x,y)*y; }
function rIsInt(r){ return r.d === 1n; }
function rNum(r){ return r.n===0n?0:Number(r.n)/Number(r.d); }
function rNeg(r){ return {n:-r.n,d:r.d}; }
function rInv(r){ if(r.n===0n) throw new Error('Division durch 0'); return {n:r.d,d:r.n}; }
function rAdd(a,b){ var d=lcm(a.d,b.d); return rq(a.n*(d/a.d)+b.n*(d/b.d), d); }
function rSub(a,b){ return rAdd(a, rNeg(b)); }
function rMul(a,b){ return rq(a.n*b.n, a.d*b.d); }
function rDiv(a,b){ return rMul(a, rInv(b)); }
function rPow(a,k){ // k: BigInt (ganzzahlig, auch negativ)
  if(k===0n) return rq(1n);
  if(k>0n){ var r=a; for(var i=1n;i<k;i++) r=rMul(r,a); return r; }
  var p=rq(1n), i=0n; while(i<(-k)){ p=rMul(p,a); i++; } return rInv(p);
}
function rIsSquare(r){ // p/q = (P/Q)² ?
  if(r.n<0n) return false;
  var a=isqrt(r.n), b=isqrt(r.d);
  return a*a===r.n && b*b===r.d ? rq(a,b) : null;
}
function isqrt(x){ if(x<2n) return x; var y=x, z=(x+1n)/2n; while(z<y){ y=z; z=(y+x/y)/2n; } return y; }
function rFromFloat(x){ // exakt, solange Float-Bruch kurz genug
  if(!isFinite(x)) throw new Error('Keine endliche Zahl');
  if(Number.isInteger(x) && Math.abs(x)<1e15) return rq(BigInt(x));
  var s=String(x); var m=s.match(/^([-0-9]+)e([+-])(\d+)$/);
  if(m){ var mant=m[1], neg=m[2]==='-', exp=parseInt(m[3],10);
    var shifted = mant*(neg?'e-'+exp:'e'+exp); x=Number(shifted); s=String(x); }
  var i=s.indexOf('e'); if(i>=0) return rq(0n); // wissenschaftlich → nicht exakt darstellbar
  var parts=s.split('.'); var dec=parts[1]||''; var den=BigInt(Math.pow(10,dec.length));
  return rq(BigInt(parts[0].replace('-','')+(dec||'0'))*(parts[0][0]==='-'?-1n:1n), den);
}
function rToStr(r){ if(r.n===0n) return '0'; return r.d===1n ? r.n.toString() : r.n+'/'+r.d; }

/* ---------- Zahlenformat ---------- */
function formatNumber(x){
  if(typeof x!=='number') x = rNum(x);
  if(!isFinite(x)) return '∞';
  if(Number.isInteger(x) && Math.abs(x)<1e15) return x.toString();
  if(Math.abs(x)>=1e15){ var s=x.toExponential(8); return s.replace(/\.?0+e/,'e'); }
  var p=x.toPrecision(12); if(p.indexOf('.')>=0 && p.indexOf('e')<0) p=p.replace(/0+$/,'').replace(/\.$/,'');
  if(p==='-0') p='0';
  return p;
}

/* ---------- Tokenizer ---------- */
var FUNCS = {
  sin:function(v){return Math.sin(_deg2rad(v));},
  cos:function(v){return Math.cos(_deg2rad(v));},
  tan:function(v){return Math.tan(_deg2rad(v));},
  asin:function(v){return _rad2deg(Math.asin(v));}, acos:function(v){return _rad2deg(Math.acos(v));},
  atan:function(v){return _rad2deg(Math.atan(v));}, atan2:Math.atan2,
  sinh:Math.sinh, cosh:Math.cosh, tanh:Math.tanh,
  exp:Math.exp, ln:Math.log, log:function(v,b){ return b===undefined?Math.log10(v):Math.log(v)/Math.log(b); },
  sqrt:Math.sqrt, cbrt:Math.cbrt, abs:Math.abs, sign:Math.sign,
  floor:Math.floor, ceil:Math.ceil, round:Math.round, trunc:Math.trunc
};
var CONSTS = { pi:Math.PI, e:Math.E, tau:2*Math.PI, phi:(1+Math.sqrt(5))/2 };

function tokenize(src){
  var t=[], i=0, s=String(src);
  while(i<s.length){
    var c=s[i];
    if(c===' '||c==='\t'||c==='\n'){ i++; continue; }
    if(c==='π'){ t.push({t:'id',v:'pi'}); i++; continue; }
    if(c==='τ'){ t.push({t:'id',v:'tau'}); i++; continue; }
    if(c==='·'||c==='×'){ t.push({t:'op',v:'*'}); i++; continue; }
    if(c==='−'){ t.push({t:'op',v:'-'}); i++; continue; }
    if(c==='÷'){ t.push({t:'op',v:'/'}); i++; continue; }
    if(c==='√'){ t.push({t:'fn',v:'sqrt'}); i++; continue; }
    if(c>='0'&&c<='9'||c==='.'){
      var j=i; while(j<s.length&&(s[j]>='0'&&s[j]<='9'||s[j]==='.')) j++;
      var raw=s.slice(i,j);
      if((raw.match(/\./g)||[]).length>1) throw new Error('Ungültige Zahl: '+raw);
      t.push({t:'num',v:raw}); i=j; continue;
    }
    if(c>='a'&&c<='z'||c>='A'&&c<='Z'||c==='_'){
      var j2=i; while(j2<s.length&&(s[j2]>='a'&&s[j2]<='z'||s[j2]>='A'&&s[j2]<='Z'||s[j2]>='0'&&s[j2]<='9'||s[j2]==='_')) j2++;
      t.push({t:'id',v:s.slice(i,j2).toLowerCase()}); i=j2; continue;
    }
    if('+-*/^%!(),'.indexOf(c)>=0){
      if(c==='('){t.push({t:'('});}else if(c===')'){t.push({t:')'});}
      else if(c===','){t.push({t:','});}
      else t.push({t:'op',v:c});
      i++; continue;
    }
    throw new Error('Unbekanntes Zeichen: '+c);
  }
  return t;
}

/* ---------- Parser (Präzedenz, Implizit-Multiplikation) ---------- */
function parseTokens(tk, vars){
  var p=0;
  function peek(){ return tk[p]; }
  function next(){ return tk[p++]; }
  function eatOp(v){ var k=peek(); if(k&&k.t==='op'&&k.v===v){ p++; return true; } return false; }
  function eatClose(){ var k=peek(); if(k&&k.t===')'){ p++; return true; } return false; }
  function eatComma(){ var k=peek(); if(k&&k.t===','){ p++; return true; } return false; }
  function isVar(n){ return vars && Object.prototype.hasOwnProperty.call(vars,n); }

  function primary(){
    var k=next();
    if(!k) throw new Error('Unerwartetes Ende');
    if(k.t==='op'&&k.v==='-') return {k:'neg',a:primary()};
    if(k.t==='op'&&k.v==='+') return primary();
    if(k.t==='num'){ var r=rq(BigInt(k.v.replace('.',''))||0n, BigInt(Math.pow(10,(k.v.split('.')[1]||'').length))); return {k:'num',r:r}; }
    if(k.t==='fn'||(k.t==='id'&&Object.prototype.hasOwnProperty.call(FUNCS,k.v))){
      if(!(peek()&&peek().t==='(')) throw new Error('"'+k.v+'" erwartet "("');
      p++;
      var args=[];
      if(!(peek()&&peek().t===')')){ args.push(expr()); while(eatComma()) args.push(expr()); }
      if(!eatClose()) throw new Error('Schließende ")" fehlt');
      return {k:'call',name:k.v,args:args};
    }
    if(k.t==='id'){
      if(isVar(k.v)) return {k:'num',r:rFromFloat(vars[k.v])};
      if(k.v==='ans') return {k:'num',r:rFromFloat(typeof ANS_VALUE==='number'?ANS_VALUE:0)};
      if(Object.prototype.hasOwnProperty.call(CONSTS,k.v)) return {k:'num',r:rFromFloat(CONSTS[k.v])};
      throw new Error('Unbekannte Variable: '+k.v);
    }
    if(k.t==='('){
      var e=expr();
      if(!eatClose()) throw new Error('Schließende ")" fehlt');
      return e;
    }
    throw new Error('Unerwartetes Symbol');
  }

  function postfix(){
    var e=primary();
    for(;;){
      var k=peek();
      if(k&&k.t==='op'&&k.v==='!'){ p++; e={k:'fact',a:e}; continue; }
      if(k&&k.t==='op'&&k.v==='%'){ p++; e={k:'pct',a:e}; continue; }
      break;
    }
    return e;
  }
  // Implizite Multiplikation: Faktor direkt gefolgt von Faktor (Zahl, Funktion, Klammer, Variable/Konstante)
  function implicit(){
    var e=postfix();
    for(;;){
      var k=peek();
      if(!k) break;
      var isFactor = k.t==='num'||k.t==='fn'||k.t==='('||
        (k.t==='id'&&(isVar(k.v)||Object.prototype.hasOwnProperty.call(CONSTS,k.v)||Object.prototype.hasOwnProperty.call(FUNCS,k.v)));
      if(!isFactor) break;
      var before=p;
      var r=postfix();
      if(p<=before) throw new Error('Parser-Fehler');
      e={k:'mul',a:e,b:r};
    }
    return e;
  }
  function power(){ // rechtsassoziativ
    var b=implicit();
    if(eatOp('^')) return {k:'pow',a:b,b:unary()};
    return b;
  }
  function unary(){
    var k=peek();
    if(k&&k.t==='op'&&k.v==='-'){ p++; return {k:'neg',a:unary()}; }
    if(k&&k.t==='op'&&k.v==='+'){ p++; return unary(); }
    return power();
  }
  function term(){
    var l=unary();
    for(;;){ if(eatOp('*')){ l={k:'mul',a:l,b:unary()}; } else if(eatOp('/')){ l={k:'div',a:l,b:unary()}; } else break; }
    return l;
  }
  function expr(){
    var l=term();
    for(;;){ if(eatOp('+')){ l={k:'add',a:l,b:term()}; } else if(eatOp('-')){ l={k:'sub',a:l,b:term()}; } else break; }
    return l;
  }
  var tree=expr();
  if(p<tk.length) throw new Error('Unerwartetes Symbol am Ende');
  return tree;
}

/* ---------- Auswertung: exakt wo möglich, sonst Float ---------- */
function ev(node){
  if(node.k==='num') return {r:node.r, exact:true};
  var a,b;
  function toF(x){ return x.exact?rNum(x.r):x.approx; }
  function flt(v){ return {approx:v, exact:false}; }
  switch(node.k){
    case 'neg': a=ev(node.a); return a.exact?{r:rNeg(a.r), exact:true}:flt(-toF(a));
    case 'fact': a=ev(node.a); if(!a.exact||!rIsInt(a.r)||a.r.n<0n) throw new Error('Fakultät nur für nicht-negative Ganzzahlen');
      if(a.r.n > 10000n) throw new Error('Fakultät nur bis 10000 berechenbar');
      return {r:factorial(a.r.n), exact:true};
    case 'pct': a=ev(node.a); return a.exact?{r:rDiv(a.r,rq(100n)), exact:true}:flt(toF(a)/100);
    case 'add': a=ev(node.a); b=ev(node.b); return a.exact&&b.exact?{r:rAdd(a.r,b.r), exact:true}:flt(toF(a)+toF(b));
    case 'sub': a=ev(node.a); b=ev(node.b); return a.exact&&b.exact?{r:rSub(a.r,b.r), exact:true}:flt(toF(a)-toF(b));
    case 'mul': a=ev(node.a); b=ev(node.b); return a.exact&&b.exact?{r:rMul(a.r,b.r), exact:true}:flt(toF(a)*toF(b));
    case 'div':
      a=ev(node.a); b=ev(node.b);
      if(b.exact&&b.r.n===0n) throw new Error('Division durch 0');
      return a.exact&&b.exact?{r:rDiv(a.r,b.r), exact:true}:flt(toF(a)/toF(b));
    case 'pow':
      a=ev(node.a); b=ev(node.b);
      if(a.exact && b.exact && rIsInt(b.r) && b.r.n > -1000n && b.r.n < 1000n) return {r:rPow(a.r,b.r.n), exact:true};
      return flt(Math.pow(toF(a),toF(b)));
    case 'call': return callFn(node);
    default: throw new Error('Knoten nicht auswertbar');
  }
}
function factorial(n){ var f=1n; for(var i=2n;i<=n;i++) f*=i; return {n:f,d:1n}; }
function callFn(node){
  var args=node.args.map(ev);
  if(node.name==='sqrt'){
    var sq=rIsSquare(args[0].r);
    if(sq) return {r:sq, exact:args[0].exact};
    return {approx:Math.sqrt(rNum(args[0].r))};
  }
  var fn=FUNCS[node.name];
  if(!fn) throw new Error('Unbekannte Funktion: '+node.name);
  var vals=args.map(function(x){ return x.exact?rNum(x.r):x.approx; });
  if(node.name==='log'&&vals.length===2) return {approx:FUNCS.log(vals[0],vals[1])};
  return {approx:fn.apply(null,vals)};
}

/* =====================================================================
   CAS v10 — Polynome, Analysis, Nullstellen, Gleichungssysteme
   Polynom = Array rationaler Koeffizienten, Index = Exponent.
   ===================================================================== */
function sup(n){ var m={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}; return String(n).split('').map(function(c){return m[c]||c;}).join(''); }
function polyZero(){ return [rq(0n)]; }
function polyIsZero(p){ return p.length===0 || (p.length===1 && p[0].n===0n); }
function polyAdd(a,b){ var n=Math.max(a.length,b.length), o=[];
  for(var i=0;i<n;i++) o.push(rAdd(a[i]||rq(0n), b[i]||rq(0n)));
  while(o.length>1 && o[o.length-1].n===0n) o.pop();
  return o; }
function polyNeg(a){ return a.map(rNeg); }
function polySub(a,b){ return polyAdd(a, polyNeg(b)); }

/* --- Quine-McCluskey: Minimierung über Primimplikanten --- */

    essential:essentials.map(function(pr){return termText(pr.b);}),
    sop:text,

}
function boolSimplify(src){

/* --- Faktorisierung (Linearfaktoren + Rest) --- */
function polyFactors(p){
  var r=polyRoots(p), work=p.slice(0), out=[];
  (r.roots||[]).forEach(function(root){
    if(!root||root.n===undefined) return;

    while(polyDegree(work)>=1&&polyHasRoot(work,root)){ work=polyDivRoot(work,root); cnt++; }
    if(!cnt) return;

    var txt=neg?'(x + '+rToStr(mag)+')':'(x − '+rToStr(mag)+')';
    out.push({root:root, count:cnt, text:txt+(cnt>1?sup(cnt):'')});
  });
  var restDeg=polyDegree(work);
  if(restDeg>=1) out.push({rest:true, text:polyToStr(work)});
  else if(restDeg===0&&work[0]&&(work[0].n>1n||work[0].n<-1n)) out.push({konst:true, text:rToStr(work[0])});
  out.sort(function(a,b){
    if(a.root&&b.root) return a.root.n<b.root.n?-1:(a.root.n>b.root.n?1:0);
    if(a.root) return -1;
    if(b.root) return 1;
    return 0;
  });
  return {factors:out, rest:work, restDeg:restDeg,
    text:out.length?out.map(function(f){return f.text;}).join(' · '):polyToStr(p)};
}
/* --- Kurvendiskussion für Polynome --- */
function polyEvalNum(p, x){
  var v=0;

}
function curveAnalyze(expr, v){

  var deg=polyDegree(p);
  if(deg<1) return {poly:p, text:'0', note:'Konstante Funktion — keine Diskussion möglich.'};
  var roots=polyRoots(p);
  var cand=polyRoots(d1);
  var extrema=[];
  (cand.roots||[]).forEach(function(r){
    var x=(r&&r.n!==undefined)?rNum(r):Number(r);
    if(!isFinite(x)) return;
    var y=polyEvalNum(p,x), d2v=polyEvalNum(d2,x);
    var type = Math.abs(d2v)<1e-12 ? (polyEvalNum(d1,x+1e-6)-polyEvalNum(d1,x-1e-6)>0?'Minimum':'Maximum')

  else parts.push('Extrema: keine');
  if(inflections.length) parts.push('Wendepunkte: '+inflections.map(function(w){return '('+formatNumber(w.x)+' | '+formatNumber(w.y)+')';}).join(', '));

function fitLine(points){
  var n=points.length; if(n<2) return null;

function primeList(n){ n=Math.min(Math.max(2,n),100000); var out=[]; for(var i=2;i<=n;i++) if(isPrimeBig(i)) out.push(i); return out; }

function crt(pairs){ // [[r1,m1],[r2,m2],…] → {x, M}

function det(m){

      var it=h[i];
      if(!it || typeof it!=='object' || Array.isArray(it)) return {ok:false, err:'history['+i+']: Objekt erwartet'};
      if(!isStr(it.e) || it.e.length>2000) return {ok:false, err:'history['+i+'].e: Text mit höchstens 2000 Zeichen erwartet'};
      if(!isStr(it.r) || it.r.length>2000) return {ok:false, err:'history['+i+'].r: Text mit höchstens 2000 Zeichen erwartet'};
      var ts = isNum(it.ts) ? Math.min(Math.max(Math.round(it.ts),0),4102444800000) : Date.now();
      ho.push({e:it.e, r:it.r, exact:typeof it.exact==='boolean'?it.exact:false, ts:ts});
    }
    out.history=ho;
  }
  if('favs' in d){
    var f=d.favs;
    if(!Array.isArray(f) || f.length>200) return {ok:false, err:'favs: Array mit höchstens 200 Einträgen erwartet'};
    var fo=[];
    for(var j=0;j<f.length;j++){

    out.ans=d.ans;
  }
  return {ok:true, data:out};
}

/* ============ Ripple (physische Reaktion) ============ */
document.addEventListener('pointerdown',function(e){
  if(S.reduce) return;
  var el=e.target.closest?e.target.closest('.btn,.key,.chip,.mod-btn,.iconbtn,.dbtn,.hist-item'):null;
  if(!el) return;
  var r=el.getBoundingClientRect(), d=Math.max(r.width,r.height)*1.4;
  var rip=h('span','ripple');
  rip.style.width=rip.style.height=d+'px';
  rip.style.left=(e.clientX-r.left-d/2)+'px';
  rip.style.top=(e.clientY-r.top-d/2)+'px';
  if(getComputedStyle(el).position==='static') el.style.position='relative';
  el.appendChild(rip);
  setTimeout(function(){rip.remove();},560);
});

/* ============ Parallax-Tiefe auf Glasflächen ============ */
if(!S.reduce) document.addEventListener('pointermove',function(e){
  var el=e.target.closest?e.target.closest('.glass'):null;
  if(!el||el.closest('.palette')) return;
  var r=el.getBoundingClientRect();
  var dx=(e.clientX-(r.left+r.width/2))/r.width, dy=(e.clientY-(r.top+r.height/2))/r.height;
  el.style.setProperty('--px',(dx*100).toFixed(2)+'%');
  el.style.transform='perspective(900px) rotateY('+(dx*2.4).toFixed(2)+'deg) rotateX('+(-dy*2.4).toFixed(2)+'deg) translateZ(0)';
},{passive:true});
document.addEventListener('pointerout',function(e){
  var el=e.target.closest?e.target.closest('.glass'):null;
  if(el) el.style.transform='';
},true);
document.addEventListener('pointerleave',function(){
  $$('.glass').forEach(function(g){g.style.transform='';});
});

var palOpen=false, palSel=0, palEntries=[];

function buildPalette(){
  palEntries=[];
  Registry.order.forEach(function(id){
    var d=Registry.mods[id];
    palEntries.push({icon:d.icon,label:d.name,sub:d.sub||'',run:function(){show(id);closePalette();}});
  });
  [ {icon:'↔',label:'Winkelmodus umschalten',sub:'DEG / RAD / GON',run:function(){cycleAngle();closePalette();}},
    {icon:'◐',label:'Akzentfarbe wechseln',sub:'blue · violet · mint · ember',run:function(){cycleAccent();closePalette();}},
    {icon:'★',label:'Verlauf leeren',sub:'Historie des Rechners',run:function(){History.clear();closePalette();toast('Verlauf geleert');}},

    {icon:'↑',label:'Daten importieren',sub:'aus JSON-Datei',run:function(){importData();closePalette();}}
  ].forEach(function(a){palEntries.push(a);});

function renderPalette(q){
  var list=$('#palList'); list.innerHTML='';
  var ql=q.toLowerCase().trim();
  var hits=ql? palEntries.filter(function(e){return (e.label+' '+e.sub).toLowerCase().indexOf(ql)>=0;}) : palEntries;
  palSel=0;
  if(!hits.length){ list.appendChild(h('div','pal-empty','Keine Treffer')); return; }
  hits.forEach(function(e,i){
    var it=h('div','pal-item'+(i===0?' sel':''));
    it.innerHTML='<span class="mi">'+e.icon+'</span><div style="min-width:0"><div style="font-weight:640">'+e.label+'</div>'+(e.sub?'<div class="help">'+e.sub+'</div>':'')+'</div>';

  });

}
$('#palInput').addEventListener('input',function(){renderPalette(this.value);});
$('#palInput').addEventListener('keydown',function(e){
  var hits=$('#palList').__hits||[];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    palSel=(palSel+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length;
    $$('.pal-item').forEach(function(it,i){it.classList.toggle('sel',i===palSel);});
  } else if(e.key==='Enter'){
    if(hits[palSel]) hits[palSel].run();
  } else if(e.key==='Escape'){ closePalette(); }
});

function cycleAngle(){ var o=['deg','rad','gon']; S.angle=o[(o.indexOf(S.angle)+1)%3]; saveSettings(); toast('Winkelmodus: '+S.angle.toUpperCase()); }
function cycleAccent(){ var o=['blue','violet','mint','ember']; S.accent=o[(o.indexOf(S.accent)+1)%o.length]; saveSettings(); toast('Akzent: '+S.accent); }
function exportData(){
  var blob=new Blob([JSON.stringify({settings:S,history:History.all(),favs:History.favs(),ans:ANS_VALUE},null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='elian-export.json'; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
  toast('Export erstellt','ok');
}
function importData(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.addEventListener('change',function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){ try{
      var d=JSON.parse(r.result);
      var v=validateImportData(d);
      if(!v.ok){ toast('Import abgelehnt: '+v.err,'err'); return; }
      if(v.data.settings){S=Object.assign(S,v.data.settings);saveSettings();}
      if(v.data.history) History.replace(v.data.history);
      if(v.data.favs) store.set('favs',v.data.favs);
      if(typeof v.data.ans==='number'){ANS_VALUE=v.data.ans;}
      show(current?currentName():'calc'); toast('Import ok','ok');
    }catch(e){toast('Import fehler: '+e.message,'err');} };
    r.readAsText(f);
  });
  inp.click();
}
function currentName(){ for(var k in Registry.mods){ if(Registry.mods[k]===current) return k; } return 'calc'; }
function copyText(t,label){
  var done=function(){toast((label||'Kopiert')+' ✓','ok');};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,function(){fallbackCopy(t);done();});
  else {fallbackCopy(t);done();}
}
function fallbackCopy(t){
  var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove();
}

register('calc',{
  name:'Rechner', icon:'🖩', group:'Rechnen', primary:true,
  sub:'Exakte Bruchrechnung, Verlauf, Favoriten',
  mount:function(root){

        '</span>'+
        '<span class="row tight"><button class="chip" data-act="fav">★ Favorit</button></span>'+
      '</div>'+
      '<div class="display" id="cDisplay">'+
        '<div class="expr" id="cExpr">0</div>'+
        '<div class="result" id="cResult">0</div>'+
      '</div>'+
      '<div class="row tight" style="margin-bottom:10px">'+
        '<button class="chip" data-ins="sin(">sin</button><button class="chip" data-ins="cos(">cos</button>'+
        '<button class="chip" data-ins="tan(">tan</button><button class="chip" data-ins="ln(">ln</button>'+
        '<button class="chip" data-ins="log(">log</button><button class="chip" data-ins="sqrt(">√</button>'+
        '<button class="chip" data-ins="^">x²</button><button class="chip" data-ins="pi">π</button>'+
        '<button class="chip" data-ins="!">n!</button>'+

      '<div class="keys" id="cKeys"></div>';

    var exprEl=$('#cExpr',card), resEl=$('#cResult',card), disp=$('#cDisplay',card);

    var undoStack=[], redoStack=[];

    function setExpr(v,keep){
      if(!keep){ undoStack.push(expr); if(undoStack.length>100) undoStack.shift(); redoStack=[]; }
      expr=v; exprEl.textContent=expr;
      liveEval();
    }
    function liveEval(){
      var r=evalExpr(expr);
      if(r.ok){
        resEl.textContent=r.text;

      } else { resEl.textContent='—'; resEl.classList.remove('exact','err'); }
    }
    function evaluate(){
      var r=evalExpr(expr);
      if(!r.ok){ resEl.textContent=r.err; resEl.classList.add('err'); toast(r.err,'err'); return; }
      disp.classList.remove('pop'); void disp.offsetWidth; disp.classList.add('pop');
      $('#cResult').textContent=r.text;
      $('#cResult').classList.toggle('exact',!!r.exact);
      ANS_VALUE=r.approx;
      History.push({e:expr,r:r.text,exact:r.exact,ts:Date.now()});
      renderHist();
      setExpr('ans',true);
      resEl=$('#cResult');
    }
    function ins(s){ if(expr==='0'){ setExpr(s==='.'?'0.':s); } else setExpr(expr+s); }
    function back(){ setExpr(expr.length>1?expr.slice(0,-1):'0'); }

    /* Tasten */
    var KEYS=[
      ['C','del','C'],['⌫','del','⌫'],['(','op','('],[')','op',')'],['%','op','%'],['÷','op','/'],
      ['7','','7'],['8','','8'],['9','','9'],['×','op','*'],['x²','fn','^2'],['√','fn','sqrt('],
      ['4','','4'],['5','','5'],['6','','6'],['−','op','-'],['^','op','^'],['1/x','fn','1/('],
      ['1','','1'],['2','','2'],['3','','3'],['+','op','+'],['π','fn','pi'],['ans','fn','ans'],
      ['0','','0'],['.','','.'],['±','fn','±'],['=','eq','=',3]
    ];
    var keys=$('#cKeys',card);
    KEYS.forEach(function(k){
      var b=h('button','key '+(k[1]||''),k[0]);
      if(k[3]) b.style.gridColumn='span '+k[3];
      b.addEventListener('click',function(){
        if(k[2]==='=') evaluate();
        else if(k[2]==='C'){ setExpr('0'); }
        else if(k[2]==='⌫') back();
        else if(k[2]==='x²') ins('^2');
        else if(k[2]==='√') ins('sqrt(');
        else if(k[2]==='±'){ setExpr(expr.charAt(0)==='-'?expr.slice(1):'-'+expr); }
        else if(k[2]==='ans'){ setExpr('ans',true); }
        else ins(k[2]);
      });
      keys.appendChild(b);
    });
    /* Dezimal + 0 separat positionieren via CSS-Grid-Reihenfolge: oben OK */

    $$('[data-ins]',card).forEach(function(b){
      b.addEventListener('click',function(){ ins(b.dataset.ins); });
    });
    $$('[data-act]',card).forEach(function(b){
      b.addEventListener('click',function(){
        var a=b.dataset.act;
        if(a==='mc'){mem=0;store.set('mem',0);toast('Speicher geleert');}
        if(a==='mr'){setExpr(String(mem));}
        if(a==='='){}
        if(a==='mp'){var r=evalExpr(expr);if(r.ok){mem+=r.approx;store.set('mem',mem);toast('M+ → '+formatNumber(mem));}else toast(r.err,'err');}
        if(a==='ms'){var r2=evalExpr(expr);if(r2.ok){mem=r2.approx;store.set('mem',mem);toast('Gespeichert');}else toast(r2.err,'err');}
        if(a==='fav'){
          var e=expr;
          if(History.toggleFav(e)){toast('Favorit ★','ok');}else{toast('Favorit entfernt');}
          renderFavs();
        }
      });
    });
    $('#cAngle',card).textContent=S.angle.toUpperCase();

    var hist=h('section','card glass');
    side.appendChild(hist);
    function renderHist(){
      var l=History.all();
      hist.innerHTML='<h3>Verlauf</h3>';
      if(!l.length){ hist.appendChild(h('div','hist-empty','Noch keine Rechnungen')); return; }
      var box=h('div','hist');
      l.slice(0,30).forEach(function(it){
        var d=h('div','hist-item');
        d.innerHTML='<div class="he">'+it.e.replace(/</g,'&lt;')+'</div><div class="hr2">'+(it.exact?'':'≈ ')+it.r.replace(/</g,'&lt;')+'</div>';
        d.addEventListener('click',function(){ setExpr(it.e); copyText(it.r,'Ergebnis'); });
        box.appendChild(d);
      });
      hist.appendChild(box);
    }
    var favs=h('section','card glass');
    side.appendChild(favs);
    function renderFavs(){
      var f=History.favs();
      favs.innerHTML='<h3>Favoriten</h3>';

        d.addEventListener('click',function(){ setExpr(e); });
        box.appendChild(d);
      });
      favs.appendChild(box);
    }
    renderHist(); renderFavs();
    liveEval();

    /* Tastatur */
    var kh=function(e){
      if(palOpen) return;
      var k=e.key;
      if(k==='Enter'){ e.preventDefault(); evaluate(); renderHist(); return; }
      if(k==='Backspace'){ e.preventDefault(); back(); return; }
      if(k==='Escape'){ setExpr('0'); return; }
      if(/^[0-9.+\-*/^%!()]/.test(k)){ e.preventDefault(); ins(k); }
    };
    document.addEventListener('keydown',kh);
    this.unmount=function(){
      document.removeEventListener('keydown',kh);
    };
    var self=this;
    /* Verlauf neu laden beim Wiedersehen */
    this.unmount=function(){ document.removeEventListener('keydown',kh); };
  }
});

register('algebra',{
  name:'Algebra', icon:'🧮', group:'Rechnen', primary:true,
  sub:'Polynome vereinfachen, ableiten, Nullstellen, Faktorisierung',
  mount:function(root){
    var c=h('section','card glass');
    c.innerHTML='<h2>Algebra-Werkstatt</h2><p class="lead">Polynome in x (und y, z). Exakte Bruchkoeffizienten. Tippen zum Rechnen.</p>'+
      '<input class="input" id="algIn" value="x^3-6x^2+11x-6" spellcheck="false">'+
      '<div class="row tight" style="margin-top:10px">'+
      '<button class="btn primary" data-op="eval">Vereinfachen</button>'+
      '<button class="btn" data-op="deriv">Ableiten</button>'+
      '<button class="btn" data-op="int">Aufleiten</button>'+
      '<button class="btn" data-op="roots">Nullstellen</button>'+
      '<button class="btn" data-op="factor">Faktorisieren</button>'+
      '<button class="btn" data-op="curve">Kurvendiskussion</button>'+
      '</div><div class="resultbox" id="algOut"></div>';
    root.appendChild(c);
    var out=$('#algOut',c);
    function show(t){ out.textContent=t; }
    function poly(){ return polyParse($('#algIn',c).value); }
    function act(op){
      try{
        var p;
        if(op==='eval'){ p=poly(); show('= '+polyToStr(p)); }
        else if(op==='deriv'){ p=poly(); show('f(x) = '+polyToStr(p)+'\nf\'(x) = '+polyToStr(polyDeriv(p))+'\nf\'\'(x) = '+polyToStr(polyDeriv(polyDeriv(p)))); }
        else if(op==='int'){ p=poly(); show('∫ '+polyToStr(p)+' dx = '+polyToStr(polyInt(p))+' + C'); }
        else if(op==='roots'){
          p=poly(); var r=polyRoots(p);
          if(r.none){ show('Keine Nullstellen.'); return; }
          var lines=['Nullstellen von '+polyToStr(p)+':'];
          var list=(r.roots||[]).map(function(x){ return x&&x.n!==undefined?rToStr(x):(x.text||formatNumber(x)); });
          lines.push(list.length?list.join(', '):'keine reellen');
          if(r.complex) lines.push('(komplexe Nullstellen dabei)');
          if(r.irrational) lines.push('(irrational — numerisch)');
          if(r.steps&&r.steps.length) lines.push('Vorgehen: '+r.steps.join(' → '));
          show(lines.join('\n'));
        }
        else if(op==='factor'){
          p=poly(); var f=polyFactors(p);
          show('Faktorisierung:\n'+polyToStr(p)+' = '+f.text+(f.restDeg>1?'\n(Restgrad '+f.restDeg+' — nicht vollständig über ℚ faktorisierbar)':''));
        }
        else if(op==='curve'){
          var ca=curveAnalyze($('#algIn',c).value);
          show(ca.text);
        }
      }catch(e){ show('Fehler: '+e.message); }
    }
    $$('[data-op]',c).forEach(function(b){ b.addEventListener('click',function(){act(b.dataset.op);}); });
    act('eval');
  }
});

register('lgs',{
  name:'Gleichungssysteme', icon:'⚖️', group:'Rechnen',
  sub:'Lineare Systeme exakt lösen — mit Lösungsweg',
  mount:function(root){
    var c=h('section','card glass');
    c.innerHTML='<h2>Gleichungssysteme</h2><p class="lead">Koeffizienten als Brüche oder Dezimalzahlen. Exakte Gauß-Elimination mit jedem Schritt.</p>'+
      '<div class="row tight"><span class="help">Variablen:</span><div class="seg" id="lgSize">'+
      '<button data-n="2" class="on">2×2</button><button data-n="3">3×3</button><button data-n="4">4×4</button></div></div>'+
      '<div id="lgMatrix"></div>'+
      '<div class="row tight" style="margin-top:10px"><button class="btn primary" id="lgSolve">Lösen</button>'+
      '<button class="btn" id="lgDet">Determinante</button><button class="btn" id="lgInv">Inverse</button></div>'+
      '<div class="resultbox" id="lgOut"></div>';
    root.appendChild(c);
    var N=2, cells=[];
    var matrix=$('#lgMatrix',c);
    var presets={2:[[2,1,5],[1,3,10]],3:[[2,1,-1,8],[-3,-1,2,-11],[-2,1,2,-3]],4:[[1,1,1,1,10],[2,3,-1,0,8],[-1,2,2,3,4],[3,-1,1,2,2]]};
    function build(){
      matrix.innerHTML='';
      cells=[];
      var data=presets[N];
      var grid=h('div','mgrid');
      grid.style.gridTemplateColumns='auto repeat('+(N+1)+',minmax(0,1fr))';
      for(var r=0;r<N;r++){
        grid.appendChild(h('div','rl','G'+(r+1)));
        for(var col=0;col<N+1;col++){
          var inp=h('input','input cell'); inp.type='text'; inp.inputMode='text';
          inp.value=String(data[r][col]!==undefined?data[r][col]:(col===N?0:0));
          if(col===N) inp.style.background='rgba(10,132,255,.10)';
          grid.appendChild(inp);
          cells.push(inp);
        }
      }
      matrix.appendChild(grid);
      matrix.appendChild(h('div','help','Letzte Spalte (blau) = rechte Seite.'));
    }
    function read(){
      var k=0, A=[], b=[];
      for(var r=0;r<N;r++){ var row=[]; for(var col=0;col<N+1;col++){ var v=parseFloat(cells[k++].value.replace(',','.')); if(!isFinite(v)) throw new Error('Zelle '+(r+1)+'/'+(col+1)+' ist keine Zahl'); row.push(v); }
        A.push(row.slice(0,N)); b.push(row[N]); }
      return {A:A,b:b};
    }
    function fmt(v){ return rToStr(v); }
    $('#lgSize',c).addEventListener('click',function(e){
      var b=e.target.closest('button[data-n]'); if(!b) return;
      $$('button',this).forEach(function(x){x.classList.remove('on');}); b.classList.add('on');
      N=parseInt(b.dataset.n,10); build();
    });
    $('#lgSolve',c).addEventListener('click',function(){
      try{
        var d=read(); var res=solveLinearSystem(d.A,d.b);
        var out=[];
        out.push('Lösung:');
        res.x.forEach(function(x,i){ out.push('  x'+(i+1)+' = '+fmt(x)); });
        if(res.none) out.push('Hinweis: System widersprüchlich — keine Lösung.');
        else if(res.infinite) out.push('Hinweis: unendlich viele Lösungen (Rang '+res.rank+' < '+N+').');
        out.push('', 'Lösungsweg:');
        res.steps.forEach(function(s,i){ out.push('  '+(i+1)+'. '+s); });
        $('#lgOut',c).textContent=out.join('\n');
      }catch(e){ $('#lgOut',c).textContent='Fehler: '+e.message; }
    });
    $('#lgDet',c).addEventListener('click',function(){
      try{ var d=read(); $('#lgOut',c).textContent='det(A) = '+fmt(det(d.A)); }
      catch(e){ $('#lgOut',c).textContent='Fehler: '+e.message; }
    });
    $('#lgInv',c).addEventListener('click',function(){
      try{
        var d=read(); var inv=matrixInverse(d.A);
        if(!inv){ $('#lgOut',c).textContent='Matrix singulär — keine Inverse.'; return; }
        var rows=inv.map(function(r){ return '  '+r.map(fmt).join('   '); });
        $('#lgOut',c).textContent='A⁻¹ =\n'+rows.join('\n');
      }catch(e){ $('#lgOut',c).textContent='Fehler: '+e.message; }
    });
    build();
  }
});

        var g=h('div','mgrid');
        g.style.gridTemplateColumns='minmax(0,1fr) minmax(0,1fr) auto';
        var x=h('input','input cell'); x.type='text'; x.value=String(p[0]); x.inputMode='decimal';
        var y=h('input','input cell'); y.type='text'; y.value=String(p[1]); y.inputMode='decimal';
        x.addEventListener('input',function(){ rows[i][0]=parseFloat(x.value.replace(',','.'))||0; });
        y.addEventListener('input',function(){ rows[i][1]=parseFloat(y.value.replace(',','.'))||0; });
        g.appendChild(x); g.appendChild(y);
        g.appendChild(h('div','rl','P'+(i+1)));
        box.appendChild(g);
      });
    }
    function read(){
      var out=[];
      for(var i=0;i<box.children.length;i++){
        var ins=box.children[i].querySelectorAll('input');
        var xv=parseFloat(ins[0].value.replace(',','.')), yv=parseFloat(ins[1].value.replace(',','.'));
        if(!isFinite(xv)||!isFinite(yv)) throw new Error('Punkt '+(i+1)+': keine gültige Zahl');
        out.push([xv,yv]);
      }
      // eindeutige x-Werte
      var seen={};
      for(var k=0;k<out.length;k++){ if(seen[out[k][0]]) throw new Error('Doppelter x-Wert: '+out[k][0]); seen[out[k][0]]=1; }
      return out;
    }
    $('#ipAdd',c).addEventListener('click',function(){ rows.push([rows.length+1,(rows.length+1)*(rows.length+1)]); build(); });
    $('#ipRemove',c).addEventListener('click',function(){ if(rows.length>2){ rows.pop(); build(); } else toast('Mindestens 2 Punkte','err'); });
    $('#ipLagrange',c).addEventListener('click',function(){
      try{
        var pts=read();
        var p=lagrangePoly(pts);
        var check=pts.map(function(pt){ return [pt[0], polyEvalNum(p,pt[0])]; });
        var exact=pts.every(function(pt){ return Math.abs(polyEvalNum(p,pt[0])-pt[1])<1e-9; });
        $('#ipOut',c).textContent='p(x) = '+polyToStr(p)+'\n\nProbe: '+check.map(function(cc){ return 'f('+cc[0]+') = '+formatNumber(cc[1]); }).join('  ·  ')+'\n'+(exact?'✓ geht durch alle Punkte':'✗ ABWEICHUNG');
      }catch(e){ $('#ipOut',c).textContent='Fehler: '+e.message; }
    });
    $('#ipSpline',c).addEventListener('click',function(){
      try{
        var pts=read();
        var s=pts.slice().sort(function(a,b){return a[0]-b[0];});
        var x=parseFloat($('#ipX',c).value.replace(',','.'));
        var v=linearSplineAt(s,x);
        $('#ipOut',c).textContent='Spline ('+s.map(function(p){return '('+p[0]+'|'+p[1]+')';}).join(' → ')+')\nx = '+formatNumber(x)+'  →  y = '+formatNumber(v);
      }catch(e){ $('#ipOut',c).textContent='Fehler: '+e.message; }
    });
    $('#ipFit',c).addEventListener('click',function(){
      try{
        var pts=read();
        var f=fitLine(pts);
        if(!f){ $('#ipOut',c).textContent='Zu wenig Punkte oder senkrechte Lage.'; return; }
        $('#ipOut',c).textContent=f.expr+'\nSteigung m = '+formatNumber(f.m)+'  ·  Achsenabschnitt b = '+formatNumber(f.b)+'\nBestimmtheitsmaß R² = '+formatNumber(f.r2);
      }catch(e){ $('#ipOut',c).textContent='Fehler: '+e.message; }
    });
    build();
  }
});

/* ============ Boot ============ */
buildMenus();
applySettings();
$('#palBtn').addEventListener('click',function(){palOpen?closePalette():openPalette();});
$('#angleBtn').addEventListener('click',cycleAngle);
$('#themeBtn').addEventListener('click',cycleAccent);
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palOpen?closePalette():openPalette();}
  if(e.altKey&&e.key.toLowerCase()==='w'){e.preventDefault();cycleAngle();}
});
window.addEventListener('scroll',function(){
  $('#top').classList.toggle('scrolled',window.scrollY>8);
},{passive:true});
function tickClock(){ var el=$('#railClock'); if(el){ var d=new Date(); el.textContent=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); } }
setInterval(tickClock,30000); tickClock();
show(store.get('lastMod','calc'));
})();
</script>
