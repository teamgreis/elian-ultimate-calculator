name: Build iOS/iPadOS App

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'ELIAN_Ultimate_Calculator_v8.0.html'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: Xcode Archive
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ios/package-lock.json

      - name: Web-App ins Capacitor-Projekt kopieren
        run: cp ../ELIAN_Ultimate_Calculator_v8.0.html www/index.html

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Capacitor-Sync (Web-Assets + Plugins)
        run: npx cap sync ios

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Signierungs-Geheimnisse prüfen
        id: signing
        env:
          P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          if [ -n "$P12_BASE64" ]; then
            echo "$P12_BASE64" | base64 --decode > /tmp/certs.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security import /tmp/certs.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-toolbar,apple,codesign -s -k "$KEYCHAIN_PASSWORD" build.keychain
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Signaturschlüssel erkannt — signierter Build."
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Keine Signatur-Geheimnisse gesetzt — unsigned-Build."
          fi

      - name: Signierungsparameter vorbereiten
        id: signargs
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          ARGS=""
          if [ -n "$KEY_B64" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ]; then
            echo "$KEY_B64" | base64 --decode > /tmp/AuthKey.p8
            ARGS="-allowProvisioningUpdates -authenticationKeyPath /tmp/AuthKey.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID"
          fi
          if [ -n "$PROFILE_NAME" ]; then
            echo "has_profile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_profile=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "signargs<<EOF"
            echo "$ARGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Archiv erstellen
        run: |
          cd ios/App
          mkdir -p build
          SIGN_ARGS="${{ steps.signargs.outputs.signargs }}"
          CODE_SIGN=NO
          if [ "${{ steps.signing.outputs.has_signing }}" = "true" ]; then
            CODE_SIGN=YES
          fi
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$PWD/build/ELIAN.xcarchive" \
            -sdk iphoneos \
            $SIGN_ARGS \
            CODE_SIGNING_ALLOWED=$CODE_SIGN \
            CODE_SIGNING_REQUIRED=NO \
            | tee build/archive.log | tail -50
          test -d build/ELIAN.xcarchive || { echo "Archiv fehlt"; exit 1; }

      - name: Archiv als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ELIAN-xcarchive
          path: ios/ios/App/build/ELIAN.xcarchive
          if-no-files-found: error
          retention-days: 14

      - name: IPA exportieren (nur mit Signatur-Geheimnissen)
        if: ${{ steps.signing.outputs.has_signing == 'true' && steps.signargs.outputs.has_profile == 'true' }}
        run: |
          cd ios/App
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>release-testing</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.elian.ultimate</key>
              <string>${{ secrets.PROVISIONING_PROFILE_NAME }}</string>
            </dict>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ELIAN.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist build/ExportOptions.plist \
            ${{ steps.signargs.outputs.signargs }}

      - name: IPA als Artefakt hochladen (optional)
        if: ${{ steps.signing.outputs.has_signing == 'true' && steps.signargs.outputs.has_profile == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ELIAN-ipa
          path: ios/ios/App/build/export/*.ipa
          retention-days: 14
