name: HTML-Prüfung

on:
  push:
    branches: [main]
    paths:
      - 'ELIAN_Ultimate_Calculator_v9.0.html'
      - 'mathe-tests.js'
      - '.github/workflows/pruefung.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruefung:
    name: JS-Syntax, HTML-Struktur, Mathematik
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript-Syntax prüfen
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('ELIAN_Ultimate_Calculator_v9.0.html', 'utf8');
            const m = html.match(/<script>([\s\S]*?)<\/script>/);
            if (!m) { console.error('kein Skript-Block gefunden'); process.exit(1); }
            fs.writeFileSync('/tmp/app.js', m[1]);
            console.log('Skript-Block: ' + m[1].length + ' Zeichen');
          "
          node --check /tmp/app.js
          echo "JavaScript-Syntax OK"

      - name: HTML-Struktur prüfen
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('ELIAN_Ultimate_Calculator_v9.0.html', 'utf8');
            const checks = [
              ['Dokumenttyp', /^<!doctype html>/i.test(html)],
              ['Titel v9.1', html.includes('<title>ELIAN Ultimate Calculator v9.1')],
              ['view-viewport', html.includes('viewport-fit=cover')],
              ['Single-File (keine externen Skripte)', !/<script[^>]+src=/.test(html)],
              ['Single-File (keine externen Stylesheets)', !/<link[^>]+stylesheet/.test(html)],
              ['Single-File (keine externen Bilder)', !/<img[^>]+src=\"http/.test(html)],
              ['Dark-/Light-Modus', html.includes('data-mode=light') || html.includes('[data-mode=light]')],
              ['Update-Mechanismus', html.includes('gh-check') || html.includes('Update')],
              [' 25 Module', (html.match(/class=\"view\"/g) || []).length >= 25],
              ['Build 9.0', html.includes(\"BUILD='9.0'\")],
              ['Exakte rationale Arithmetik', html.includes('evalExprExact') && html.includes('astEvalRat')],
              ['Stammfunktionen (Baustein 3)', html.includes('integrateTerm') && html.includes('polyInt')],
              ['Nullstellen exakt (Baustein 5)', html.includes('solvePolyEquation') && html.includes('horner')],
              ['Kurvendiskussion (Baustein 9)', html.includes('curveAnalyze')],
              ['Vektoren (Baustein 6)', html.includes('vecCross') && html.includes('vecAngle')],
              ['Eigenwerte (Baustein 7)', html.includes('eigenOf') && html.includes('qrEigen')],
              ['Grenzwerte (Baustein 8)', html.includes('limitAtFiniteExact') && html.includes('limitInfExact')],
              ['DGL (Baustein 10)', html.includes('dglExact') && html.includes('dglEuler')],
              ['Verteilungen (Baustein 11)', html.includes('binomPMF') && html.includes('confInterval')],
              ['Kein Capacitor-Rest', !html.includes('window.Capacitor')]
            ];
            let bad = 0;
            for (const [n, ok] of checks) {
              console.log((ok ? 'OK  ' : 'FAIL') + '  ' + n.trim());
              if (!ok) bad++;
            }
            process.exit(bad ? 1 : 0);
          "

      - name: Mathematik-Eigenschaftstests
        run: node mathe-tests.js
